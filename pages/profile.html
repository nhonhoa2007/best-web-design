<section id="profile-screen" class="profile-screen hidden">
    <nav class="profile-topbar" aria-label="Profile navigation">
        <button class="profile-brand" type="button" data-back-home>VKU 360 Quest</button>
        <div class="profile-nav-links">
            <button type="button" data-back-home>Dashboard</button>
            <button type="button" data-open-page="quest">Quests</button>
            <button type="button" data-open-page="leaderboard">Leaderboard</button>
            <button type="button" data-open-page="library">Library</button>
            <span>Profile</span>
            <button type="button" data-open-page="events">Events</button>
        </div>
        <div class="profile-nav-actions">
            <button class="theme-toggle-btn" type="button" aria-label="Switch to light theme">
                <i class="ph ph-sun"></i>
                <span>Light</span>
            </button>
            <button class="profile-icon-button profile-menu-toggle" type="button" data-profile-menu-toggle aria-label="Mở thanh điều khiển" aria-expanded="false">
                <i class="ph ph-list"></i>
            </button>
            <button class="profile-icon-button" type="button" aria-label="Notifications">
                <i class="ph ph-bell"></i>
            </button>
            <button id="profile-logout-btn" class="profile-icon-button" type="button" aria-label="Logout">
                <i class="ph ph-sign-out"></i>
            </button>
            <button id="profile-home-avatar" class="profile-mini-avatar" type="button" data-start-tour aria-label="Avatar">
                <i class="ph ph-user-circle"></i>
            </button>
        </div>
    </nav>

    <div class="profile-page-shell">
        <section class="profile-hero-card">
            <div class="profile-avatar-stage">
                <div class="profile-portrait">
                    <i class="ph ph-user-circle"></i>
                </div>
                <span>LVL <strong id="profile-level">1</strong></span>
            </div>
            <div class="profile-hero-copy">
                <h1 id="profile-home-name">Explorer</h1>
                <div class="profile-badges">
                    <span>VKU Explorer</span>
                    <span id="profile-home-email">Virtual Hub Alpha</span>
                </div>
                <div class="profile-avatar-actions">
                    <input id="profile-avatar-file" type="file" accept="image/*" hidden>
                    <button id="upload-profile-avatar" type="button">
                        <i class="ph ph-camera"></i>
                        Upload avatar
                    </button>
                    <span id="profile-avatar-status" aria-live="polite"></span>
                </div>
                <div class="profile-progress-row">
                    <div>
                        <span>XP Progress</span>
                        <strong><span id="profile-xp-current">0</span> / <span id="profile-xp-total">0</span></strong>
                    </div>
                    <div class="profile-progress-track" aria-label="XP Progress">
                        <span id="profile-xp-progress"></span>
                    </div>
                </div>
            </div>
        </section>

        <section class="profile-stat-grid" aria-label="Player stats">
            <article>
                <i class="ph ph-sparkle"></i>
                <strong id="profile-home-progress">0</strong>
                <span>Quests Done</span>
            </article>
            <article>
                <i class="ph ph-medal"></i>
                <strong id="profile-total-xp">0</strong>
                <span>Total XP</span>
            </article>
            <article>
                <i class="ph ph-chart-bar"></i>
                <strong id="profile-ranking">--</strong>
                <span>Ranking</span>
            </article>
            <article>
                <i class="ph ph-images"></i>
                <strong id="profile-home-moments">0</strong>
                <span>Moments</span>
            </article>
        </section>

        <section class="profile-content-grid">
            <div class="profile-achievements-wrap">
                <div class="profile-section-title">
                    <h2>My Achievements</h2>
                    <button type="button">View All <i class="ph ph-arrow-right"></i></button>
                </div>
                <div id="profile-achievement-grid" class="profile-achievement-grid">
                    <article class="profile-achievement-card rare">
                        <i class="ph ph-spinner-gap"></i>
                        <strong>Đang tải achievements</strong>
                        <span>Firebase</span>
                    </article>
                </div>
            </div>

            <div id="profile-notifications" class="profile-activity-wrap">
                <div class="profile-section-title">
                    <h2>Recent Activity</h2>
                </div>
                <div id="notification-list" class="profile-activity-list">
                    <article class="profile-activity-item is-highlight">
                        <span></span>
                        <div>
                            <strong>Đang tải hoạt động</strong>
                            <time>Firebase</time>
                        </div>
                    </article>
                </div>
                <span id="profile-home-reactions" class="profile-hidden-stat">0</span>
            </div>
        </section>
    </div>
</section>

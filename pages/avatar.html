<section id="avatar-screen" class="avatar-screen hidden">
        <div class="avatar-stage">
            <div class="brand-lockup">
                <span class="brand-icon"><i class="ph ph-compass"></i></span>
                <span>VKU 360 Quest</span>
            </div>

            <div class="intro-copy">
                <p class="eyebrow">Hành trình nhập vai</p>
                <h1>Chọn người đại diện để bắt đầu khám phá VKU</h1>
                <p>Đi từng khu, mở khóa từng địa điểm và thu thập ghi chú về những nơi quan trọng trong khuôn viên.</p>
            </div>

            <div class="custom-avatar-section">
                <div class="input-group">
                    <label for="custom-avatar-name">Tên nhân vật của bạn</label>
                    <div class="input-wrapper">
                        <i class="ph ph-user-circle"></i>
                        <input type="text" id="custom-avatar-name" placeholder="Nhập tên bạn muốn (ví dụ: Sói cô độc, Imposter...)" autocomplete="off">
                    </div>
                </div>
            </div>

            <div id="avatar-options" class="avatar-options" aria-label="Chọn màu sắc/vai trò đại diện"></div>

            <div class="avatar-actions">
                <button id="start-new-tour-btn" class="primary-button" type="button" disabled>
                    Bắt đầu hành trình <i class="ph ph-arrow-right"></i>
                </button>
                <button id="resume-tour" class="resume-button hidden" type="button">
                    <i class="ph ph-play-circle"></i> Tiếp tục hành trình trước
                </button>
            </div>
        </div>
    </section>

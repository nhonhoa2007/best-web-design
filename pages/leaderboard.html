<section id="leaderboard-screen" class="profile-screen hidden">
    <nav class="profile-topbar" aria-label="Leaderboard navigation">
        <button class="profile-brand leaderboard-brand" type="button" data-back-home>
            <span>VKU 360</span>
            <span>Quest</span>
        </button>
        <div class="profile-nav-links">
            <button type="button" data-back-home>Dashboard</button>
            <button type="button" data-open-page="quest">Quests</button>
            <span>Leaderboard</span>
            <button type="button" data-open-page="library">Library</button>
            <button type="button" data-open-page="profile">Profile</button>
            <button type="button" data-open-page="events">Events</button>
            <button class="profile-mobile-logout" type="button" data-logout>Đăng xuất</button>
        </div>
        <div class="profile-nav-actions">
            <button class="theme-toggle-btn" type="button" aria-label="Switch to light theme">
                <i class="ph ph-sun"></i>
                <span>Light</span>
            </button>
            <button class="profile-icon-button profile-menu-toggle" type="button" data-profile-menu-toggle aria-label="Mở thanh điều khiển" aria-expanded="false">
                <i class="ph ph-list"></i>
            </button>
            <button class="profile-icon-button" type="button" data-open-page="profile" aria-label="Notifications">
                <i class="ph ph-bell"></i>
            </button>
            <button class="profile-icon-button" type="button" data-start-tour aria-label="Map 360">
                <i class="ph ph-map-trifold"></i>
            </button>
            <button class="profile-mini-avatar" type="button" data-open-page="profile" aria-label="Profile">
                <i class="ph ph-user-circle"></i>
            </button>
        </div>
    </nav>

    <div class="profile-page-shell">
        <section class="standalone-page-hero leaderboard-hero">
            <div class="leaderboard-hero-copy">
                <span class="standalone-page-kicker">Live Ranking</span>
                <h1>Bảng xếp hạng</h1>
                <p>Theo dõi người chơi nổi bật dựa trên số chặng đã hoàn thành và khoảnh khắc đã lưu.</p>
            </div>
            <aside id="leaderboard-top-avatar" class="leaderboard-top-avatar" aria-label="Người đứng đầu bảng xếp hạng">
                <i class="ph ph-user-circle"></i>
            </aside>
        </section>

        <section class="home-dashboard-section leaderboard-section">
            <div id="leaderboard-table" class="leaderboard-table" aria-label="Bảng xếp hạng VKU 360 Quest">
                <div class="leaderboard-row head">
                    <span>Rank</span>
                    <span>Người chơi</span>
                    <span>Tiến độ</span>
                    <span>Điểm</span>
                </div>
                <div class="leaderboard-row">
                    <span>#1</span>
                    <strong>Explorer Minh</strong>
                    <span>20/20 chặng</span>
                    <span>1,940</span>
                </div>
                <div class="leaderboard-row">
                    <span>#2</span>
                    <strong>VKU Navigator</strong>
                    <span>18/20 chặng</span>
                    <span>1,720</span>
                </div>
                <div class="leaderboard-row">
                    <span>#3</span>
                    <strong>Campus Hunter</strong>
                    <span>15/20 chặng</span>
                    <span>1,380</span>
                </div>
            </div>
        </section>
    </div>
</section>
